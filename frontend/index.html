<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OptiCore AI - Ring 2 Incident Trace</title>
<style>
  :root {
    --bg: #0b0e11;
    --panel: #12161b;
    --border: #232a32;
    --text: #d7dde3;
    --dim: #7a8794;
    --amber: #e8a33d;
    --green: #4caf6f;
    --red: #d9534f;
    --mono: "Consolas", "SFMono-Regular", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    margin: 0;
    padding: 32px 20px;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 {
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--dim);
    margin: 0 0 4px 0;
  }
  h2 {
    font-size: 22px;
    margin: 0 0 24px 0;
    color: var(--text);
  }
  .step {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--dim);
    border-radius: 4px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .step.decision { border-left-color: var(--amber); }
  .step.decision.auto { border-left-color: var(--green); }
  .step-label {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 6px;
  }
  .step-body { font-size: 13.5px; line-height: 1.5; }
  .kv { color: var(--dim); }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 11px;
    font-weight: bold;
  }
  .badge.auto { background: rgba(76,175,111,0.15); color: var(--green); }
  .badge.escalate { background: rgba(217,83,79,0.15); color: var(--red); }
  #status { color: var(--dim); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>OptiCore AI - v1 demo</h1>
  <h2>Ring 2 incident trace</h2>
  <div id="status">loading...</div>
  <div id="trace"></div>
</div>

<script>
async function loadTrace() {
  const status = document.getElementById("status");
  const traceEl = document.getElementById("trace");
  try {
    const res = await fetch("/incidents/ring2-demo");
    if (!res.ok) throw new Error("request failed: " + res.status);
    const data = await res.json();
    status.remove();
    render(data[0]);
  } catch (err) {
    status.textContent = "could not load trace: " + err.message;
  }
}

function step(label, bodyHtml, extraClass) {
  const div = document.createElement("div");
  div.className = "step" + (extraClass ? " " + extraClass : "");
  div.innerHTML = `<div class="step-label">${label}</div><div class="step-body">${bodyHtml}</div>`;
  return div;
}

function render(d) {
  const traceEl = document.getElementById("trace");

  traceEl.appendChild(step("1. Alarm Agent", `
    <span class="kv">ring:</span> ${d.alarm.ring} &nbsp;
    <span class="kv">vendor:</span> ${d.alarm.vendor} &nbsp;
    <span class="kv">severity:</span> ${d.alarm.highest_severity}<br>
    <span class="kv">alarm count:</span> ${d.alarm.alarm_count}
  `));

  traceEl.appendChild(step("2. RCA Agent", `
    <span class="kv">hypothesis:</span> ${d.rca.top_hypothesis}<br>
    <span class="kv">confidence:</span> ${d.rca.confidence}%
  `));

  traceEl.appendChild(step("3. Simulation Agent", `
    <span class="kv">proposed action:</span> ${d.simulation.proposed_action}<br>
    <span class="kv">blast radius:</span> ${d.simulation.blast_radius}<br>
    <span class="kv">cross-domain:</span> ${d.simulation.cross_domain}
  `));

  traceEl.appendChild(step("4. Schedule Agent", `
    <span class="kv">change window:</span> ${d.schedule.change_window}<br>
    <span class="kv">technician dispatch:</span> ${d.schedule.technician_dispatch_required}
  `));

  const isAuto = d.policy_decision === "Auto-proceed";
  traceEl.appendChild(step("5. Orchestrator decision", `
    <span class="badge ${isAuto ? 'auto' : 'escalate'}">${d.policy_decision}</span>
  `, "step decision" + (isAuto ? " auto" : "")));

  traceEl.appendChild(step("6. Report Agent - closure", `
    <span class="kv">incident:</span> ${d.closure_report.incident_id}<br>
    <span class="kv">closed at:</span> ${d.closure_report.closed_at}
  `));
}

loadTrace();
</script>
</body>
</html>
